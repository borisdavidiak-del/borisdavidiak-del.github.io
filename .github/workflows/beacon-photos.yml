name: Beacon photos
# Скачивает фото проектов со старого сайта (beacon/img/sources.txt),
# кадрирует их в 4:3, делает лёгкую цветокоррекцию и коммитит в beacon/img.
on:
  push:
    paths: ['beacon/img/sources.txt', '.github/workflows/beacon-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y imagemagick
      - name: Download and process
        run: |
          cd beacon/img
          # градиент-карта в цветах маяка: ночь -> индиго -> красный -> янтарь
          convert -size 1x256 gradient: -rotate 90 \( xc:'#07061a' xc:'#2b2470' xc:'#c4425a' xc:'#ffb81c' xc:'#fff4d6' +append -filter Cubic -resize 256x1! \) -delete 0 /tmp/clut.png
          while read -r slug url; do
            [ -z "$slug" ] && continue
            # yadisk:<публичная ссылка>|<путь к файлу> — фото из публичной папки Яндекс Диска
            if [[ "$url" == yadisk:* ]]; then
              ref="${url#yadisk:}"
              url=$(curl -fsSL -G "https://cloud-api.yandex.net/v1/disk/public/resources/download" \
                --data-urlencode "public_key=${ref%%|*}" --data-urlencode "path=${ref#*|}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["href"])') || { echo "skip $slug"; continue; }
            fi
            curl -fsSL -A "Mozilla/5.0" "$url" -o "/tmp/$slug.src" || { echo "skip $slug"; continue; }
            convert "/tmp/$slug.src[0]" -auto-orient -resize '1400x1050^' -gravity center -extent 1400x1050 \
              -level 0%,85%,1.35 -modulate 100,90 \
              \( +clone -colorspace gray /tmp/clut.png -clut \) -compose blend -define compose:args=38 -composite \
              \( +clone -fill gray50 -colorize 100 -attenuate 0.35 +noise Gaussian -colorspace gray \) -compose softlight -composite \
              -strip -interlace Plane -quality 84 "$slug.jpg"
            echo "ok $slug"
          done < sources.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A beacon/img
          git diff --cached --quiet || (git commit -m "Add processed beacon project photos" && git push)
