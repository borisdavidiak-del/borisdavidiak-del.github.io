name: Beacon project pages
# Собирает тексты и галереи страниц проектов со старого сайта botu.su,
# тонирует фото так же, как обложки, и коммитит в beacon/data и beacon/img/p.
on:
  push:
    paths: ['tools/scrape_projects.py', '.github/workflows/beacon-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y imagemagick
      - name: Scrape
        run: |
          python3 tools/scrape_projects.py microelectronics-forum electric-sahara-in-mriya miss-intercontinental moon-vibes \
            day-dream-festival-in-mriya crazy-asia-in-mriya novemberfest artbat microelectronics-forum-art-object \
            music-award-stage new-year-ice-rink medusa-cosmic-traveler manzherok-stage exhibition-pavilion-yalta \
            helicopter-hangar-festival prosvet-event gesture
      - name: Process photos
        run: |
          convert -size 1x256 gradient: -rotate 90 \( xc:'#07061a' xc:'#2b2470' xc:'#c4425a' xc:'#ffb81c' xc:'#fff4d6' +append -filter Cubic -resize 256x1! \) -delete 0 /tmp/clut.png
          for d in /tmp/beacon-src/*/; do
            slug=$(basename "$d"); out="beacon/img/p/$slug"; mkdir -p "$out"; rm -f "$out"/*.jpg
            for f in "$d"*; do
              n=$(basename "${f%.*}")
              # пропускаем мелкие картинки (иконки, превью)
              w=$(identify -format '%w' "$f[0]" 2>/dev/null || echo 0); [ "$w" -lt 500 ] && continue
              convert "$f[0]" -auto-orient -resize '2000x2000>' \
                -level 0%,85%,1.35 -modulate 100,90 \
                \( +clone -colorspace gray /tmp/clut.png -clut \) -compose blend -define compose:args=38 -composite \
                \( +clone -fill gray50 -colorize 100 -attenuate 0.35 +noise Gaussian -colorspace gray \) -compose softlight -composite \
                -strip -interlace Plane -quality 82 "$out/$n.jpg" || true
            done
          done
          # контактный лист для проверки
          mkdir -p beacon/data/sheets
          for d in beacon/img/p/*/; do slug=$(basename "$d"); ls "$d"*.jpg >/dev/null 2>&1 || continue
            montage -label '%t' "$d"*.jpg -resize 300x300 -tile 6x -geometry +3+3 -pointsize 14 "beacon/data/sheets/$slug.jpg"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A beacon/data beacon/img/p
          git diff --cached --quiet || (git commit -m "Scrape beacon project pages" && git push)
