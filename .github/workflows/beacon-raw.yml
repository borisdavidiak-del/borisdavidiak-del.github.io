name: Beacon raw
on:
  push:
    branches: [beacon-scout]
permissions:
  contents: write
jobs:
  raw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw
          for s in moon-vibes manzherok-stage gesture; do curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36" https://botu.su/$s -o raw/$s.html; done
          for u in $(grep -o 'https://static.tildacdn.com/ws/[^"]*' raw/moon-vibes.html | head -3); do curl -sSL "$u" -o "raw/$(basename "${u%%\?*}")"; done
          ls -la raw
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add raw && git commit -m raw && git push
